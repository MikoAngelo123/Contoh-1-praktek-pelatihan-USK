<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontak - PT. Digital Nusantara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">PT. Digital Nusantara</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="tentang.html">Tentang Kami</a></li>
                    <li class="nav-item"><a class="nav-link" href="layanan.html">Layanan</a></li>
                    <li class="nav-item"><a class="nav-link active" href="kontak.html">Kontak</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        <section class="container col-md-6">
            <h2 class="text-center mb-4">Hubungi Kami</h2>
            
            <div id="alertSukses" class="alert alert-success d-none" role="alert">
                Pesan berhasil dikirim! Terima kasih telah menghubungi kami.
            </div>

            <form id="formKontak" onsubmit="return validateForm(event)">
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama</label>
                    <input type="text" id="nama" class="form-control" placeholder="Masukkan nama Anda">
                    <div id="errorNama" class="text-danger small mt-1"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="text" id="email" class="form-control" placeholder="contoh@domain.com">
                    <div id="errorEmail" class="text-danger small mt-1"></div>
                </div>
                <div class="mb-3">
                    <label for="pesan" class="form-label">Pesan</label>
                    <textarea id="pesan" class="form-control" rows="4" placeholder="Tuliskan pesan Anda..."></textarea>
                    <div id="errorPesan" class="text-danger small mt-1"></div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Kirim Pesan</button>
            </form>
        </section>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        <div class="container"><p class="mb-0">&copy; 2026 PT. Digital Nusantara.</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
